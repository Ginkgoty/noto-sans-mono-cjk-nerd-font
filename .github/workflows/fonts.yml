name: Build regional fonts
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish (leave blank for a test build)
        type: string
        required: false
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read

jobs:
  lint:
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
      - name: Identify the source commit
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" == v* ]] && git check-ref-format "refs/tags/$RELEASE_TAG" || exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check Python code
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/ruff check scripts
          .venv/bin/ruff format --check scripts

  fonts:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        region: [SC, JP, HK, TC, KR]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.lint.outputs.commit }}
      - name: Prepare pinned tools and upstream inputs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          scripts/prepare.sh
          curl -fLsS --retry 3 -o .cache/FontForge.AppImage https://github.com/fontforge/fontforge/releases/download/20251009/FontForge-2025-10-09-Linux-x86_64.AppImage
          cd .cache
          echo 'bf72ec45305c663da7d2288822b7d2cfc37846716322bdca4075273c0cef8294  FontForge.AppImage' | sha256sum -c -
          chmod +x FontForge.AppImage
          ./FontForge.AppImage --appimage-extract > /dev/null
          echo "FONTFORGE=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Build and check both weights
        env:
          REGION: ${{ matrix.region }}
        run: |
          for style in Regular Bold; do .venv/bin/python scripts/build_font.py "$REGION" "$style"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fonts-${{ matrix.region }}
          path: dist/*.otf
          if-no-files-found: error
          compression-level: 0

  package:
    needs: [lint, fonts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ needs.lint.outputs.commit }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fonts-*
          merge-multiple: true
          path: dist
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [lint, package]
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Confirm the tag still points to the tested commit
        env:
          TESTED_COMMIT: ${{ needs.lint.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages
          path: dist
      - name: Publish verified archives
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes *.zip SHA256SUMS
